name: Thomson10 distance 1.935 proof

on:
  push:
    paths:
      - 'Thomson10Chord1935/**'
      - '.github/workflows/thomson10-chord1935.yml'
  pull_request:
    paths:
      - 'Thomson10Chord1935/**'
      - '.github/workflows/thomson10-chord1935.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LEAN_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: Thomson10Chord1935
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Rebuild proof sources and audit the final statements
        working-directory: Thomson10Chord1935
        run: python3 verify.py --package-root . --seconds 16200
